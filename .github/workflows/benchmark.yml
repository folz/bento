name: Benchmark

on:
  workflow_dispatch:

jobs:
  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - name: Cache deps and build for mix
        uses: actions/cache@v6
        with:
          path: |
            bench/deps
            bench/_build
          key: ${{ runner.os }}-bench-${{ hashFiles('bench/mix.lock') }}
          restore-keys: ${{ runner.os }}-bench-
      - run: mix deps.get
      - run: mix bench.gen
      - run: mix bench.decode
      - run: mix bench.encode
      - run: mix bench.retention
      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: benchee-reports
          path: |
            bench/output/*.html
            bench/output/runs/*.benchee
